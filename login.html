<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KIDV Invoice – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:#f0f4f8;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
body::before{content:'';position:fixed;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(47,129,247,0.08),transparent 70%);pointer-events:none;}
body::after{content:'';position:fixed;bottom:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(57,208,216,0.06),transparent 70%);pointer-events:none;}
.login-card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;width:420px;max-width:95vw;padding:40px;box-shadow:0 24px 80px rgba(0,0,0,0.5);animation:slideUp .4s cubic-bezier(0.2,0,0,1);}
@keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.logo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:32px;}
.logo-box{width:48px;height:48px;background:linear-gradient(135deg,#2f81f7,#39d0d8);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;box-shadow:0 0 20px rgba(47,129,247,0.35);}
.logo-text{font-size:20px;font-weight:700;}.logo-sub{font-size:12px;color:#7d8590;margin-top:2px;}
.login-title{font-size:24px;font-weight:700;margin-bottom:6px;}
.login-sub{font-size:14px;color:#7d8590;margin-bottom:28px;}
.tab-row{display:flex;gap:4px;background:#f0f4f8;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:4px;margin-bottom:24px;}
.tab{flex:1;padding:8px;border-radius:7px;font-family:'Outfit',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;border:none;color:#6b7a90;background:none;transition:all .18s;}
.tab.active{background:#fff;color:#1a2332;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:#7d8590;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
.input-wrap{position:relative;}
.input-wrap .material-icons-round{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#4a5568;}
.form-group input{width:100%;background:#f8faff;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 14px 12px 42px;color:#1a2332;font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s;}
.form-group input:focus{border-color:#2f81f7;box-shadow:0 0 0 3px rgba(47,129,247,0.12);}
.form-group input::placeholder{color:#4a5568;}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#2f81f7,#39d0d8);color:#fff;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 20px rgba(47,129,247,0.35);transition:all .18s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(47,129,247,0.45);}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.btn-login .material-icons-round{font-size:20px;}
.error-box{background:rgba(248,81,73,0.08);border:1px solid rgba(248,81,73,0.2);border-radius:10px;padding:10px 14px;font-size:13px;color:#f85149;margin-bottom:16px;display:none;align-items:center;gap:8px;}
.error-box.show{display:flex;}
.error-box .material-icons-round{font-size:16px;flex-shrink:0;}
.forgot{text-align:right;margin-top:-8px;margin-bottom:16px;}
.forgot a{font-size:12.5px;color:#2f81f7;text-decoration:none;cursor:pointer;}
.forgot a:hover{text-decoration:underline;}
.loading-spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.admin-badge{background:rgba(247,201,72,0.1);border:1px solid rgba(247,201,72,0.2);border-radius:8px;padding:8px 14px;font-size:12px;color:#f7c948;margin-bottom:20px;display:flex;align-items:center;gap:6px;}
.admin-badge .material-icons-round{font-size:15px;}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-wrap">
    <div class="logo-box">KI</div>
    <div><div class="logo-text">KIDV Invoice</div><div class="logo-sub">by KIDV Tech</div></div>
  </div>
  <div class="login-title" id="formTitle">Welcome back</div>
  <div class="login-sub" id="formSub">Sign in to your account</div>
  <div class="tab-row">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
    <button class="tab" id="tabRegister" onclick="switchTab('register')">Create Account</button>
  </div>
  <div class="error-box" id="errorBox"><span class="material-icons-round">error</span><span id="errorMsg"></span></div>

  <!-- Login -->
  <div id="loginForm">
    <div class="form-group"><label>Email</label><div class="input-wrap"><span class="material-icons-round">mail</span><input type="email" id="loginEmail" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()"/></div></div>
    <div class="form-group"><label>Password</label><div class="input-wrap"><span class="material-icons-round">lock</span><input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div></div>
    <div class="forgot"><a onclick="doForgot()">Forgot password?</a></div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <span class="loading-spinner" id="loginSpinner"></span>
      <span class="material-icons-round" id="loginIcon">login</span>
      <span id="loginTxt">Sign In</span>
    </button>
  </div>

  <!-- Register -->
  <div id="registerForm" style="display:none">
    <div class="admin-badge"><span class="material-icons-round">admin_panel_settings</span>Admin account — full access to all data</div>
    <div class="form-group"><label>Full Name</label><div class="input-wrap"><span class="material-icons-round">person</span><input type="text" id="regName" placeholder="Your name"/></div></div>
    <div class="form-group"><label>Email</label><div class="input-wrap"><span class="material-icons-round">mail</span><input type="email" id="regEmail" placeholder="your@email.com"/></div></div>
    <div class="form-group"><label>Password</label><div class="input-wrap"><span class="material-icons-round">lock</span><input type="password" id="regPass" placeholder="Min 6 characters" onkeydown="if(event.key==='Enter')doRegister()"/></div></div>
    <button class="btn-login" id="regBtn" onclick="doRegister()">
      <span class="loading-spinner" id="regSpinner"></span>
      <span class="material-icons-round" id="regIcon">person_add</span>
      <span id="regTxt">Create Account</span>
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyDFx2hxhTo2HJKbNK-FUgBiMgvHDzCVmoE",authDomain:"kidv-tech-project.firebaseapp.com",projectId:"kidv-tech-project",storageBucket:"kidv-tech-project.firebasestorage.app",messagingSenderId:"168663801953",appId:"1:168663801953:web:af953338df12480b4fca20",measurementId:"G-KY98RSCW77"};
if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth();
const db=firebase.firestore();

// ADMIN emails — tame add karo
const ADMIN_EMAILS=['amit@kidvtech.com']; // tamaro email add karo

auth.onAuthStateChanged(async user=>{
  if(user){
    // Mark as admin if in list
    const isAdmin=ADMIN_EMAILS.includes(user.email.toLowerCase());
    await db.collection('users').doc(user.uid).set({
      email:user.email,name:user.displayName||'',
      isAdmin:isAdmin,lastLogin:new Date().toISOString()
    },{merge:true});
    location.href='index.html';
  }
});

function switchTab(t){
  document.getElementById('loginForm').style.display=t==='login'?'':'none';
  document.getElementById('registerForm').style.display=t==='register'?'':'none';
  document.getElementById('tabLogin').classList.toggle('active',t==='login');
  document.getElementById('tabRegister').classList.toggle('active',t==='register');
  document.getElementById('formTitle').textContent=t==='login'?'Welcome back':'Create account';
  document.getElementById('formSub').textContent=t==='login'?'Sign in to your account':'Set up KIDV Invoice account';
  hideError();
}

function setLoading(btn,spinner,icon,txt,on,label){
  document.getElementById(btn).disabled=on;
  document.getElementById(spinner).style.display=on?'block':'none';
  document.getElementById(icon).style.display=on?'none':'';
  document.getElementById(txt).textContent=on?'Please wait...':label;
}
function showError(msg){document.getElementById('errorMsg').textContent=msg;document.getElementById('errorBox').classList.add('show');}
function hideError(){document.getElementById('errorBox').classList.remove('show');}
function friendlyError(code){
  const m={'auth/user-not-found':'Email not found. Please create account.','auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Invalid email or password.','auth/email-already-in-use':'Email already registered. Please sign in.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Invalid email address.','auth/too-many-requests':'Too many attempts. Try again later.'};
  return m[code]||'Error: '+code;
}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  if(!email||!pass){showError('Please enter email and password.');return;}
  hideError();
  setLoading('loginBtn','loginSpinner','loginIcon','loginTxt',true,'Sign In');
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ showError(friendlyError(e.code)); setLoading('loginBtn','loginSpinner','loginIcon','loginTxt',false,'Sign In'); }
}

async function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPass').value;
  if(!name||!email||!pass){showError('Please fill all fields.');return;}
  hideError();
  setLoading('regBtn','regSpinner','regIcon','regTxt',true,'Create Account');
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    await cred.user.updateProfile({displayName:name});
  }catch(e){ showError(friendlyError(e.code)); setLoading('regBtn','regSpinner','regIcon','regTxt',false,'Create Account'); }
}

async function doForgot(){
  const email=document.getElementById('loginEmail').value.trim();
  if(!email){showError('Enter your email first.');return;}
  try{ await auth.sendPasswordResetEmail(email); alert('Password reset email sent to '+email); }
  catch(e){ showError(friendlyError(e.code)); }
}
</script>
</body>
</html>
