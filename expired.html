<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KIDV Invoice – Trial Expired</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link rel="icon" type="image/png" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<meta property="og:image" content="https://invoice.kidvtech.com/logo.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#fff;border-radius:24px;padding:48px 40px;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.1);}
.icon{width:72px;height:72px;background:#fff7ed;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
.icon .material-icons-round{font-size:36px;color:#d97706;}
h1{font-size:24px;font-weight:800;color:#1a2332;margin-bottom:10px;}
p{font-size:14px;color:#6b7a90;line-height:1.7;margin-bottom:28px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 28px;border-radius:12px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .18s;width:100%;margin-bottom:12px;}
.btn-primary{background:linear-gradient(135deg,#2f81f7,#39d0d8);color:#fff;box-shadow:0 4px 14px rgba(47,129,247,0.3);}
.btn-primary:hover{transform:translateY(-1px);}
.btn-wa{background:#25d366;color:#fff;}
.btn-wa:hover{background:#22c55e;}
.btn-ghost{background:#f0f4f8;color:#1a2332;}
.divider{color:#9ca3af;font-size:12px;margin:8px 0;}

  /* Page transition */
  @keyframes _pgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  body{animation:_pgIn 0.2s ease-out;}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><span class="material-icons-round">lock_clock</span></div>
  <h1>Trial Period Expired</h1>
  <p>Your 14-day free trial has ended. Subscribe now to continue using KIDV Invoice and keep all your data safe.</p>
  <a href="subscribe.html" class="btn btn-primary"><span class="material-icons-round">workspace_premium</span>View Plans & Subscribe</a>
  <div class="divider">or contact us directly</div>
  <a href="https://wa.me/917984486885?text=Hi, my KIDV Invoice trial expired. Please help me activate." target="_blank" class="btn btn-wa"><span class="material-icons-round">whatsapp</span>WhatsApp Support</a>
  <button onclick="if(window.KIDV)KIDV.logout()" class="btn btn-ghost">Sign Out</button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="kidv-common.js"></script>
</body>
</html>
