<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2f81f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#39d0d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f81f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Logo box -->
  <rect x="2" y="4" width="52" height="52" rx="14" fill="url(#g1)" />
  <!-- KI letters -->
  <text x="28" y="37" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">KI</text>
  <!-- KIDV Invoice text -->
  <text x="64" y="28" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#1a2332" letter-spacing="-0.5">KIDV</text>
  <text x="64" y="46" font-family="'Outfit', sans-serif" font-size="13" font-weight="500" fill="#6b7a90" letter-spacing="0.5">Invoice</text>
  <!-- Dot accent -->
  <circle cx="118" cy="28" r="3" fill="url(#g1)" />
</svg>
